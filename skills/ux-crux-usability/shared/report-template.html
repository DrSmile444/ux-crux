<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:">
<title>UX review</title>
<style>
:root{
  --bg:#FDF9EF; --surface:#FFFFFF; --soft:#F6F0E2; --ink:#0F2440; --muted:#506078; --faint:#8592A3; --line:#ECE4D3;
  --accent:#045CB1; --accent-soft:#E4EEF8; --mark:#F0503F; --sun:#FEC724; --navy:#022D53;
  --blocker:#D2402F; --major:#946500; --moderate:#045CB1; --minor:#5E6E84;
  --ok:#045CB1; --ok-soft:#E4EEF8; --warn:#FEC724; --warn-soft:#FFF4D1;
  --shadow:0 1px 2px rgba(2,45,83,.05),0 10px 30px rgba(2,45,83,.06);
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1B2E; --surface:#12263D; --soft:#1A3049; --ink:#FDF9EF; --muted:#A9B7C7; --faint:#7A8BA0; --line:#24405E;
    --accent:#6FA8E8; --accent-soft:#1B3A5E; --mark:#FF7A70; --sun:#FEC724; --navy:#022D53;
    --blocker:#FF7A70; --major:#FEC724; --moderate:#6FA8E8; --minor:#A9B7C7;
    --ok:#6FA8E8; --ok-soft:#1B3A5E; --warn:#FEC724; --warn-soft:#3A3010;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1B2E; --surface:#12263D; --soft:#1A3049; --ink:#FDF9EF; --muted:#A9B7C7; --faint:#7A8BA0; --line:#24405E;
  --accent:#6FA8E8; --accent-soft:#1B3A5E; --mark:#FF7A70; --sun:#FEC724; --navy:#022D53;
  --blocker:#FF7A70; --major:#FEC724; --moderate:#6FA8E8; --minor:#A9B7C7;
  --ok:#6FA8E8; --ok-soft:#1B3A5E; --warn:#FEC724; --warn-soft:#3A3010;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);padding:56px 16px 160px;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:64px}
h1{font:700 clamp(30px,6vw,44px)/1.1 var(--body);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:650 24px/1.25 var(--body);margin:0;letter-spacing:-.01em}
h3{font:600 21px/1.35 var(--body);margin:0;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.eyebrow{font:600 12px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.55}
header{display:flex;flex-direction:column;gap:18px}
.lede{font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end;padding-top:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:650 34px/1 var(--body);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.stat.zero b{color:var(--faint)}
.verdict{font:600 14px var(--body);background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;align-self:center}
.howto{font-size:14px;color:var(--muted);max-width:66ch;border-top:1px solid var(--line);padding-top:18px}
nav.groups{display:flex;flex-wrap:wrap;gap:6px 22px;position:sticky;top:0;z-index:2;padding:14px 0;margin:-40px 0 -32px;background:var(--bg);border-bottom:1px solid var(--line)}
nav.groups a{font:500 14px var(--body);color:var(--muted);text-decoration:none}
nav.groups a:hover{color:var(--ink)}
nav.groups .n{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
section.group{display:flex;flex-direction:column;gap:24px}
.ghead{display:flex;flex-direction:column;gap:6px}
.ghead h2 .n{color:var(--faint);font-weight:500;margin-left:8px}
.ghead p{color:var(--muted);font-size:15px;max-width:62ch}
.card{background:var(--surface);border-radius:20px;padding:32px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:24px;min-width:0}
@media (max-width:560px){.card{padding:22px 18px;border-radius:16px}body{padding-top:32px}}
.f.is-decided{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--ok)}
.fhead{display:flex;flex-direction:column;gap:10px}
.sev{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase}
.sev::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sev.blocker{color:var(--blocker)}.sev.major{color:var(--major)}.sev.major::before{background:var(--sun)}.sev.moderate{color:var(--moderate)}.sev.minor{color:var(--minor)}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.where{font-size:14px;color:var(--muted)}
.meta{font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta code{font:12.5px var(--mono);color:var(--muted)}
.decided{font:600 12px var(--body);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 10px}
.text{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.text .why{color:var(--muted)}
.text .why b{color:var(--ink);font-weight:600}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--soft);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.55}
.rid{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rsrc{color:var(--muted);font-size:13px;line-height:1.5}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
.panels{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.panel{position:relative;flex:1 1 260px;max-width:360px;min-width:0}
.pic{position:relative;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.pic img{display:block;width:100%;height:auto}
.frag{padding:52px 18px 22px;background:#FFFFFF;color:#0F2440;border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:auto}
.ptitle{font-size:13px;color:var(--muted);margin-top:8px}
.lbl{position:absolute;top:10px;left:10px;z-index:1;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 9px;background:var(--navy);color:#FDF9EF}
.lbl.proposal{background:#045CB1;color:#FFFFFF}
.lbl.recon{background:var(--sun);color:var(--navy)}
.mk{position:absolute;border:2px solid var(--mark);border-radius:4px;pointer-events:none}
.mk.dash{border-style:dashed}
.mk.gap{border-width:0 0 0 2px;border-radius:0}
.mk.gap::before,.mk.gap::after{content:"";position:absolute;left:-7px;width:12px;border-top:2px solid var(--mark)}
.mk.gap::before{top:0}.mk.gap::after{bottom:0}
.mk.line{left:0!important;width:100%!important;height:0!important;border-width:2px 0 0 0;border-radius:0}
.mk span{position:absolute;left:-2px;bottom:100%;margin-bottom:4px;font:600 11px/1.3 var(--body);background:var(--mark);color:#FFFFFF;padding:2px 6px;border-radius:4px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.mk.below span{bottom:auto;top:100%;margin:4px 0 0}
.mk.gap span{left:8px;bottom:auto;top:50%;transform:translateY(-50%);margin:0}
figcaption{font-size:14px;color:var(--muted);max-width:66ch}
.na{flex:1 1 260px;max-width:360px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;color:var(--muted);font-size:14px;text-align:center}
.pair{display:flex;gap:12px;align-items:center;max-width:340px}
.pair .step img{aspect-ratio:4/3}
.pair .step{flex:1}
.pair .arrow{color:var(--faint);font-size:18px}
.decision{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--faint)}
.opt input{margin:5px 0 0;accent-color:var(--accent);flex:none}
.opt .t{flex:1;min-width:0;font-size:16px;line-height:1.55}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rec{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:var(--sun);border-radius:999px;padding:5px 8px;margin-left:8px;vertical-align:2px}
.triage{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.pill{position:relative;display:inline-flex;align-items:center;font:500 14px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.pill:hover{color:var(--ink);border-color:var(--faint)}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill:has(input:checked){color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.pill:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);max-width:66ch}
.hint:empty{display:none}
textarea{display:none;width:100%;min-height:44px;resize:vertical;font:15px/1.5 var(--body);color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 14px}
textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.chosen textarea{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 16px}
.step{display:flex;flex-direction:column;gap:10px;min-width:0;font-size:14px;line-height:1.45}
.step img{display:block;width:100%;aspect-ratio:39/46;object-fit:cover;object-position:top;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.step .ph0{aspect-ratio:39/46;display:grid;place-items:center;color:var(--faint);font-size:13px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;text-align:center}
.step .sb{display:flex;flex-direction:column;gap:6px}
.step .sn{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.step .st{font-weight:600}
.step .why{color:var(--muted);font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:4px 10px}
.dots a{text-decoration:none;font-size:13px;font-weight:600}
.dots .sev{font-size:11px;gap:5px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.list li:first-child{border-top:0;padding-top:0}
.list li:last-child{padding-bottom:0}
.list .ids{font:12.5px var(--mono);color:var(--faint)}
.list .lens{font-weight:600;text-transform:capitalize}
ol.top{counter-reset:t}
ol.top li{counter-increment:t;padding-left:44px;position:relative}
ol.top li::before{content:counter(t);position:absolute;left:0;top:14px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--navy);font:600 14px/30px var(--body);text-align:center}
ol.top li:first-child::before{top:-2px}
ol.top a{color:var(--ink);font-weight:500;text-decoration:none}
ol.top a:hover{color:var(--accent)}
details.check summary{cursor:pointer;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.tbl th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tbl .rid{font-size:11px}
.score{font-size:14px;color:var(--muted)}
.dock{position:fixed;left:16px;right:16px;bottom:16px;z-index:3}
.dock .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:18px;padding:12px 12px 12px 20px;box-shadow:0 2px 6px rgba(2,45,83,.08),0 18px 40px rgba(2,45,83,.14);border:1px solid var(--line)}
.meter{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.track{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--ok);width:0;transition:width .2s}
button.act{font:600 15px var(--body);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--surface)}
button.act:not(.ghost):hover{background:var(--navy);color:#FDF9EF}
button.ghost{background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
#outbox{max-width:820px;margin:8px auto 0}
#out{display:block;min-height:120px;font:13px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line)}
.err{border:2px solid var(--blocker);color:var(--blocker);border-radius:14px;padding:18px}
@media (prefers-reduced-motion:reduce){.fill,.opt,.pill{transition:none}}
@media print{.dock,nav.groups{display:none}body{padding-bottom:16px}.card{box-shadow:none;border:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="dock" id="dock" hidden>
  <div class="in">
    <div class="meter"><span id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div>
    <button class="act ghost" id="clear" type="button"></button>
    <button class="act" id="copy" type="button"></button>
  </div>
  <div id="outbox" hidden><textarea id="out" readonly></textarea></div>
</div>
<script type="application/json" id="findings">/*FINDINGS_JSON*/</script>
<script>
(function(){
"use strict";
var EN={
  lede:"Each finding shows what was observed, the rule behind it and its source, and the options. Pick one option per finding, add a comment if needed, then press “Copy decisions” and paste the text back to the agent.",
  flow_map:"Flow map", flow_sub:"Each step of the walked flow and the findings on it.",
  blockers:"Blockers", major:"Major issues", health:"Category health", missing:"Missing states / missing context",
  top3:"Top 3 highest-impact changes", minor:"Moderate / minor findings", checklist:"Full-mode checklist",
  checklist_sub:"Every rule checked in full mode, with its verdict.",
  observation:"Observed", why:"Why it matters", rules:"Rules", location:"Where", source:"Source",
  decision:"Your decision", recommended:"Recommended", fix:"Fix",
  t_wont_fix:"Won’t fix", t_not_an_issue:"Not an issue", t_defer:"Defer", t_verify_first:"Verify first",
  wont_fix:"Won’t fix: accept the risk. Say why in the comment.",
  not_an_issue:"Not an issue: a false-positive condition holds. Say which in the comment.",
  defer:"Defer: decide later.", verify_first:"Verify first, then decide.",
  applies_if:"Not an issue if", how:"How",
  comment:"Comment (optional)", decided:"decided", copy:"Copy decisions", clear:"Clear", copied:"Copied. Paste it to the agent.",
  progress:"Decided {n} of {m}", captured:"Captured", reconstruction:"Reconstruction", proposal:"Proposal",
  schematic:"Schematic", before:"As found", after:"With the fix",
  not_reached:"Not reached", observed:"Observed, no capture", step:"Step", lenses:"Lenses applied", not_applied:"Not applied",
  mode:"Mode", evidence:"Evidence", none:"None.", no_data:"This report has no findings data.",
  all:"All", score:"Score", resolves:"Resolves with", na_before:"Not assessable: no picture of the unobserved state.",
  clear_confirm:"Clear all choices on this page?"
};
function el(tag,attrs){
  var n=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="text")n.textContent=v;else if(k==="cls")n.className=v;else n.setAttribute(k,v===true?"":v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x!=null)n.appendChild(typeof x==="string"?document.createTextNode(x):x);});
    else n.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return n;
}
var root=document.getElementById("root"),D;
try{D=JSON.parse(document.getElementById("findings").textContent);}catch(e){D=null;}
if(!D||!Array.isArray(D.findings)){root.appendChild(el("p",{cls:"err",text:EN.no_data}));return;}
var T={};for(var k in EN)T[k]=EN[k];if(D.strings)for(var s in D.strings)T[s]=D.strings[s];
document.documentElement.lang=D.language||"en";
document.title=D.title||"UX review";
var RULES=D.rules||{},IMAGES=D.images||{},FINDINGS=D.findings;
var SEV=["blocker","major","moderate","minor"];
var STORE="ux-crux-report:"+(D.report_id||D.title||"report");
var state={};
try{state=JSON.parse(localStorage.getItem(STORE)||"{}")||{};}catch(e){state={};}
FINDINGS.forEach(function(f){if(!state[f.id]&&f.decision)state[f.id]={o:f.decision.option,c:f.decision.comment||""};});
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function shortRule(id){var p=String(id).split("#");var dom=p[0].split("/")[0];return {dom:dom,id:p[1]||p[0]};}
function ruleIds(ids){return (ids||[]).map(function(id){var r=shortRule(id);return r.dom+" · "+r.id;}).join("   ");}
function imgSrc(id){var im=IMAGES[id];return im?(im.src||im.file||""):"";}
function sanitize(html){
  var t=document.createElement("template");t.innerHTML=html||"";
  t.content.querySelectorAll("script,iframe,object,embed,link,meta,base").forEach(function(n){n.remove();});
  t.content.querySelectorAll("*").forEach(function(n){Array.prototype.slice.call(n.attributes).forEach(function(a){
    if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name);});});
  return t.innerHTML;
}
function fragment(html,css){
  var host=el("div",{cls:"frag"});var sh=host.attachShadow({mode:"open"});
  sh.innerHTML="<style>:host{display:block;font:15px/1.4 system-ui,sans-serif;color:#0F2440}"+(css||"").replace(/<\/?style/gi,"")+"</style>"+sanitize(html);
  return host;
}
function markers(list){
  return (list||[]).map(function(m){
    var st="left:"+(m.x||0)+"%;top:"+(m.y||0)+"%;";
    if(m.type!=="line"&&m.type!=="gap")st+="width:"+(m.w||0)+"%;height:"+(m.h||0)+"%;";
    if(m.type==="gap")st+="height:"+(m.h||0)+"%;";
    var d=el("div",{cls:"mk "+(m.type||"box")+((m.y||0)<8?" below":""),style:st});
    if(m.label)d.appendChild(el("span",{text:m.label}));
    return d;
  });
}
function panelLabel(tier,role){
  if(role==="after")return el("span",{cls:"lbl proposal",text:T.proposal});
  if(tier==="capture")return el("span",{cls:"lbl",text:T.captured});
  return el("span",{cls:"lbl recon",text:T.reconstruction+(tier==="schematic"?" · "+T.schematic:"")});
}
function picture(f){
  var p=f.picture;if(!p||!p.panels)return null;
  var na=f.evidence_status==="NOT_ASSESSABLE";
  var panels=p.panels.filter(function(x){return !(na&&x.role!=="after");});
  var box=el("div",{cls:"panels"});
  if(na)box.appendChild(el("div",{cls:"na",text:T.na_before}));
  panels.forEach(function(x){
    var body=x.image?el("div",{cls:"pic"},el("img",{src:imgSrc(x.image),alt:x.title||"",loading:"lazy"}),markers(x.markers)):fragment(x.html,x.css);
    box.appendChild(el("div",{cls:"panel"},panelLabel(p.tier,x.role),body,el("p",{cls:"ptitle",text:x.title||(x.role==="after"?T.after:T.before)})));
  });
  return el("figure",null,box,p.caption?el("figcaption",{text:p.caption}):null);
}
function flowStep(flowId,n){var fl=(D.flows||[]).filter(function(x){return x.id===flowId;})[0];return fl?(fl.steps||[]).filter(function(s){return s.n===n;})[0]:null;}
function stepThumb(s){
  if(!s)return el("div",{cls:"step nr"},el("div",{cls:"ph0",text:"?"}));
  var img=s.image&&imgSrc(s.image)?el("img",{src:imgSrc(s.image),alt:s.title||""}):el("div",{cls:"ph0",text:s.status==="not_reached"?T.not_reached:T.observed});
  return el("div",{cls:"step"+(s.status==="not_reached"?" nr":"")},img,el("div",{cls:"sb"},el("span",{cls:"sn",text:T.step+" "+s.n}),el("span",{cls:"st",text:s.title||""})));
}
function locText(l){
  if(!l)return null;var fl=(D.flows||[]).filter(function(x){return x.id===l.flow;})[0];var name=fl?fl.title:l.flow;
  if(l.from!=null)return name+" · "+T.step+" "+l.from+" → "+l.to;
